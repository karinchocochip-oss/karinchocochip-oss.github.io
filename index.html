
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>もか | ポートフォリオ</title>

  <style>
    /* ページ全体の基本設定 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
      color: #625b68;
      line-height: 1.8;
      background: linear-gradient(
        135deg,
        #fff0f5,
        #f0f5ff,
        #f0fff7,
        #fff9e9
      );
      min-height: 100vh;
    }

    /* ヘッダー */
    header {
      text-align: center;
      padding: 75px 20px 55px;
    }

    .subtitle {
      color: #a58da9;
      font-size: 14px;
      letter-spacing: 4px;
    }

    h1 {
      font-size: 48px;
      color: #db91b3;
      margin: 10px 0;
    }

    .catchcopy {
      font-size: 17px;
      color: #87758c;
      margin-top: 15px;
    }

    /* コンテンツ全体の配置 */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 70px;
    }

    /* ふんわりしたカードデザイン */
    .card {
      background: rgba(255, 255, 255, 0.82);
      border: 2px solid #ffffff;
      border-radius: 28px;
      padding: 32px 38px;
      margin-bottom: 25px;
      box-shadow: 0 8px 25px rgba(185, 155, 190, 0.12);
    }

    /* 見出し */
    h2 {
      font-size: 22px;
      color: #c58cae;
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 2px dashed #f0d6e6;
    }

    /* 基本情報の表示 */
    .profile-item {
      margin: 12px 0;
    }

    .profile-item strong {
      color: #b48db5;
    }

    /* 趣味のタグ */
    .hobbies {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .hobby {
      background: #fce8f1;
      color: #9f718f;
      border-radius: 30px;
      padding: 9px 19px;
      font-size: 14px;
    }

    /* 趣味ごとにパステルカラーを変更 */
    .hobby:nth-child(2) {
      background: #e7eaff;
      color: #777caf;
    }

    .hobby:nth-child(3) {
      background: #e4f7ec;
      color: #6a9d83;
    }

    .hobby:nth-child(4) {
      background: #fff0d8;
      color: #b28b55;
    }

    .hobby:nth-child(5) {
      background: #f0e6ff;
      color: #9278ae;
    }

    /* ひとことメッセージ */
    .message {
      text-align: center;
      font-size: 20px;
      color: #b783a4;
      padding: 15px 0;
    }

    /* フッター */
    footer {
      text-align: center;
      padding: 25px;
      color: #ad9cab;
      font-size: 13px;
    }

    /* スマートフォン向けのレイアウト調整 */
    @media (max-width: 600px) {
      header {
        padding: 50px 15px 35px;
      }

      h1 {
        font-size: 38px;
      }

      .catchcopy {
        font-size: 15px;
      }

      main {
        padding: 0 15px 40px;
      }

      .card {
        padding: 25px 20px;
        border-radius: 22px;
      }

      h2 {
        font-size: 20px;
      }

      .hobby {
        font-size: 13px;
        padding: 8px 15px;
      }
    }
  </style>
</head>

<body>

  <!-- サイト上部のタイトルとキャッチコピー -->
  <header>
    <p class="subtitle">MY PORTFOLIO</p>
    <h1>もか</h1>
    <p class="catchcopy">一日中ゴロゴロしていたい</p>
  </header>

  <!-- 自己紹介のメインコンテンツ -->
  <main>

    <!-- 基本情報 -->
    <section class="card">
      <h2>基本情報</h2>
      <p class="profile-item"><strong>名前：</strong>もか</p>
      <p class="profile-item"><strong>学年：</strong>3年</p>
      <p class="profile-item"><strong>所属：</strong>工学部情報工学科</p>
    </section>

    <!-- 趣味・好きなこと -->
    <section class="card">
      <h2>趣味・好きなこと</h2>
      <div class="hobbies">
        <span class="hobby">ゲーム</span>
        <span class="hobby">ライブ参戦</span>
        <span class="hobby">サッカー観戦</span>
        <span class="hobby">食べること</span>
        <span class="hobby">寝ること</span>
      </div>
    </section>

    <!-- プログラミング経験 -->
    <section class="card">
      <h2>プログラミング経験</h2>
      <p>授業でやったことのみ</p>
    </section>

    <!-- この授業で学びたいこと -->
    <section class="card">
      <h2>この授業で学びたいこと</h2>
      <p>OSSの使い方</p>
    </section>

    <!-- サイトのイメージ -->
    <section class="card">
      <h2>サイトのイメージ</h2>
      <p class="profile-item"><strong>好きな色：</strong>全部</p>
      <p class="profile-item"><strong>雰囲気：</strong>ぽあぽあ</p>
    </section>

    <!-- 最後のひとこと -->
    <section class="card">
      <h2>ひとこと</h2>
      <p class="message">ストレスは少ない方がいい</p>
    </section>

  </main>

  <!-- ページ下部 -->
  <footer>
    <p>もかのポートフォリオ</p>
  </footer>

</body>
</html>
